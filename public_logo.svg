<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: bridge with 2 pillars + arch + ascending docs -->
  <g>
    <!-- Left pillar -->
    <rect x="6"  y="20" width="5" height="22" rx="1" fill="#003366"/>
    <!-- Right pillar -->
    <rect x="33" y="20" width="5" height="22" rx="1" fill="#003366"/>
    <!-- Arch (the bridge) -->
    <path d="M11 22 Q22 6 33 22" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Deck line -->
    <line x1="6" y1="22" x2="38" y2="22" stroke="#003366" stroke-width="2" stroke-linecap="round"/>
    <!-- Cloud base -->
    <ellipse cx="22" cy="36" rx="14" ry="4" fill="#003366" opacity="0.18"/>
    <!-- Ascending documents (3 dots) -->
    <circle cx="18" cy="16" r="1.6" fill="#00A651"/>
    <circle cx="22" cy="11" r="1.6" fill="#00A651"/>
    <circle cx="26" cy="6"  r="1.6" fill="#00A651"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="32" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#003366" letter-spacing="0.5">DARAJA</text>
</svg>
